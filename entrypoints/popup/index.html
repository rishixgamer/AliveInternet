<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ThreadSieve</title>
  </head>
  <body>
    <main>
      <h1>ThreadSieve</h1>
      <p>Rule-based YouTube spam filtering. No comments leave your device.</p>
      <label class="toggle"><input id="enabled" type="checkbox" /> Enable filtering</label>
      <label for="mode">Filtering strength</label>
      <select id="mode">
        <option value="conservative">Conservative (fewest collapses)</option>
        <option value="balanced">Balanced</option>
        <option value="aggressive">Aggressive (may hide more legitimate comments)</option>
      </select>
      <label class="toggle"><input id="annotateFlagged" type="checkbox" /> Mark suspicious comments without hiding them</label>
      <p class="foot">All hidden comments can be restored. Scores are not bot probabilities.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
